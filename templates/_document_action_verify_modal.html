<div id="docActionVerifyModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" onclick="closeDocActionVerifyModal()"></div>
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md relative z-10">
            <div class="bg-gradient-to-r from-indigo-600 to-purple-600 rounded-t-2xl px-6 py-4 flex items-center justify-between">
                <h3 class="text-lg font-bold text-white flex items-center" id="docActionVerifyTitle">
                    <i class="fas fa-shield-alt mr-2"></i>Verify your identity
                </h3>
                <button type="button" onclick="closeDocActionVerifyModal()" class="text-white hover:text-indigo-200">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6">
                <p class="text-sm text-gray-600 mb-1" id="docActionVerifyActionText">To continue, enter the verification code sent to your registered email.</p>
                <p class="text-sm font-bold text-gray-900 mb-4 truncate" id="docActionVerifyDocName"></p>

                <div id="docActionVerifySendStatus" class="hidden mb-4 p-3 rounded-xl bg-indigo-50 border border-indigo-100 text-sm text-indigo-800"></div>
                <div id="docActionVerifyError" class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-100 text-sm text-red-700"></div>

                <label class="block text-sm font-semibold text-gray-700 mb-2" for="docActionVerifyCode">6-digit verification code</label>
                <input type="text" id="docActionVerifyCode" maxlength="6" inputmode="numeric" pattern="[0-9]*"
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-lg tracking-[0.4em] text-center font-mono"
                       placeholder="000000" autocomplete="one-time-code">

                <p class="text-xs text-gray-500 mt-3">
                    Didn't receive it?
                    <button type="button" id="docActionVerifyResendBtn" onclick="sendDocActionVerificationCode()" class="text-indigo-600 font-semibold hover:text-indigo-800">Resend code</button>
                </p>
            </div>
            <div class="px-6 py-4 bg-gray-50 rounded-b-2xl flex items-center justify-end gap-3">
                <button type="button" onclick="closeDocActionVerifyModal()" class="px-5 py-2.5 bg-gray-200 text-gray-700 rounded-xl hover:bg-gray-300 text-sm font-semibold">
                    Cancel
                </button>
                <button type="button" onclick="confirmDocActionVerified()" id="docActionVerifyConfirmBtn" class="px-5 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl hover:from-indigo-700 hover:to-purple-700 text-sm font-bold flex items-center">
                    <i class="fas fa-check mr-2"></i><span id="docActionVerifyConfirmLabel">Confirm</span>
                </button>
            </div>
        </div>
    </div>
</div>
