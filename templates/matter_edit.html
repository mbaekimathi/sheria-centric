{% extends "base.html" %}

{% block title %}Edit Matter - {{ matter_data.matter_reference_number }} - SHERIA CENTRIC{% endblock %}

{% block content %}
<style>
    .matter-edit-page { background: linear-gradient(160deg, #f1f5f9 0%, #e2e8f0 50%, #f8fafc 100%); min-height: 100%; }
    .matter-edit-header {
        background: linear-gradient(135deg, #2563eb 0%, #4f46e5 50%, #6366f1 100%);
        border-radius: 1rem; box-shadow: 0 10px 40px rgba(37, 99, 235, 0.25);
        border-left: 4px solid rgba(255,255,255,0.3);
    }
    .matter-edit-card {
        background: #ffffff;
        border-radius: 1rem;
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-left: 4px solid #10b981;
    }
    .matter-edit-label {
        color: #334155;
        font-weight: 600;
        font-size: 0.875rem;
        letter-spacing: 0.01em;
        margin-bottom: 0.375rem;
        display: block;
    }
    .matter-edit-input {
        width: 100%;
        padding: 0.625rem 0.875rem;
        border: 1px solid #94a3b8;
        border-radius: 0.5rem;
        background: #ffffff !important;
        color: #1e293b !important;
        font-size: 0.9375rem;
    }
    .matter-edit-input:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.25);
        border-color: #6366f1;
    }
    .matter-edit-input::placeholder { color: #94a3b8; }
    textarea.matter-edit-input { min-height: 6rem; resize: vertical; }
    .matter-edit-dropdown {
        position: absolute;
        z-index: 50;
        width: 100%;
        margin-top: 0.25rem;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 0.5rem;
        box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
        max-height: 14rem;
        overflow-y: auto;
    }
    .matter-edit-dropdown div:hover { background: #eef2ff; }
    .matter-edit-btn-primary {
        background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
        color: white;
        font-weight: 600;
        padding: 0.625rem 1.25rem;
        border-radius: 0.5rem;
        box-shadow: 0 2px 8px rgba(79, 70, 229, 0.35);
    }
    .matter-edit-btn-primary:hover:not(:disabled) { filter: brightness(1.05); transform: translateY(-1px); }
    .matter-edit-btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
</style>

<div class="matter-edit-page max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    <!-- Page Header -->
    <div class="matter-edit-header p-5 sm:p-6 mb-6 text-white">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="flex items-center gap-4">
                <a href="{{ url_for('matter_details', matter_id=matter_id) }}" class="flex-shrink-0 w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center hover:bg-white/30 transition-colors" title="Back to matter">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold mb-1 flex items-center gap-2">
                        <i class="fas fa-edit opacity-90"></i>
                        Edit Matter
                    </h1>
                    <p class="text-white/90 text-sm sm:text-base">Reference: <span class="font-semibold">{{ matter_data.matter_reference_number }}</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Matter Edit Form -->
    <div class="matter-edit-card p-6 sm:p-8">
        <form id="matterEditForm" class="space-y-6">
            <input type="hidden" id="matter_id" name="matter_id" value="{{ matter_id }}" />
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Matter Title -->
                <div class="md:col-span-2">
                    <label for="matter_title" class="matter-edit-label">
                        Matter Title <span class="text-red-500">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="matter_title" 
                        name="matter_title"
                        class="matter-edit-input uppercase"
                        placeholder="Enter matter title..."
                        value="{{ matter_data.matter_title or '' }}"
                        autocomplete="off"
                        required
                        oninput="this.value = this.value.toUpperCase()"
                    />
                </div>

                <!-- Matter Category -->
                <div class="md:col-span-2">
                    <label for="matter_category" class="matter-edit-label">
                        Matter Category <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="matter_category" 
                            name="matter_category"
                            class="matter-edit-input uppercase"
                            placeholder="Enter or select matter category..."
                            value="{{ matter_data.matter_category or '' }}"
                            autocomplete="off"
                            required
                            oninput="this.value = this.value.toUpperCase(); searchCategories(this.value)"
                        />
                        <div id="matter_category_dropdown" class="hidden matter-edit-dropdown">
                        </div>
                    </div>
                </div>

                <!-- Client Instructions -->
                <div class="md:col-span-2">
                    <label for="client_instructions" class="matter-edit-label">
                        Client Instructions <span class="text-gray-500 text-xs font-normal">(Optional)</span>
                    </label>
                    <textarea 
                        id="client_instructions" 
                        name="client_instructions"
                        rows="4"
                        class="matter-edit-input"
                        placeholder="Enter client instructions or requirements..."
                    >{{ matter_data.client_instructions or '' }}</textarea>
                </div>

                <!-- Assigned Employee -->
                <div class="md:col-span-2">
                    <label for="employee_search" class="matter-edit-label">
                        Assigned Employee <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="employee_search" 
                            name="employee_search"
                            class="matter-edit-input pr-10"
                            placeholder="Search employee by name..."
                            value="{{ matter_data.assigned_employee_name or '' }}"
                            autocomplete="off"
                            required
                            oninput="searchEmployees(this.value)"
                        />
                        <i class="fas fa-search absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        <input type="hidden" id="assigned_employee_id" name="assigned_employee_id" value="{{ matter_data.assigned_employee_id or '' }}" />
                        <div id="employee_dropdown" class="hidden matter-edit-dropdown">
                        </div>
                    </div>
                </div>

                <!-- Date Opened -->
                <div>
                    <label for="date_opened" class="matter-edit-label">
                        Date Opened <span class="text-red-500">*</span>
                    </label>
                    <input 
                        type="date" 
                        id="date_opened" 
                        name="date_opened"
                        class="matter-edit-input"
                        value="{{ matter_data.date_opened or '' }}"
                        required
                    />
                </div>
            </div>

            <!-- Form Actions -->
            <div class="flex flex-wrap justify-end gap-3 pt-6 border-t border-gray-200">
                <a href="{{ url_for('matter_details', matter_id=matter_id) }}" class="inline-flex items-center gap-2 px-5 py-2.5 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-semibold transition-colors">
                    <i class="fas fa-times"></i> Cancel
                </a>
                <button 
                    type="submit"
                    id="submitBtn"
                    class="matter-edit-btn-primary inline-flex items-center gap-2 transition-all"
                >
                    <i class="fas fa-save"></i>
                    <span id="submitBtnText">Update Matter</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function searchEmployees(query) {
    const dropdown = document.getElementById('employee_dropdown');
    
    if (query.length < 2) {
        dropdown.classList.add('hidden');
        return;
    }
    
    fetch(`/api/matters/employees/search?q=${encodeURIComponent(query)}`)
        .then(response => response.json())
        .then(data => {
            dropdown.innerHTML = '';
            
            if (data.error || !data.employees || data.employees.length === 0) {
                dropdown.innerHTML = '<div class="px-4 py-2 text-gray-500">No employees found</div>';
                dropdown.classList.remove('hidden');
                return;
            }
            
            data.employees.forEach(employee => {
                const item = document.createElement('div');
                item.className = 'px-4 py-2.5 cursor-pointer border-b border-gray-100 last:border-0 text-gray-800 hover:bg-indigo-50 transition-colors';
                const name = employee.full_name || '';
                const code = employee.employee_code || '';
                item.textContent = `${name}${code ? ' (' + code + ')' : ''}`;
                item.onclick = () => {
                    document.getElementById('employee_search').value = `${name}${code ? ' (' + code + ')' : ''}`;
                    document.getElementById('assigned_employee_id').value = employee.id;
                    dropdown.classList.add('hidden');
                };
                dropdown.appendChild(item);
            });
            
            dropdown.classList.remove('hidden');
        })
        .catch(error => {
            console.error('Error:', error);
            dropdown.innerHTML = '<div class="px-4 py-2 text-red-500">Error searching employees</div>';
            dropdown.classList.remove('hidden');
        });
}

function searchCategories(query) {
    const dropdown = document.getElementById('matter_category_dropdown');
    
    if (query.length < 1) {
        dropdown.classList.add('hidden');
        return;
    }
    
    fetch(`/api/matters/categories/search?q=${encodeURIComponent(query.toUpperCase())}`)
        .then(response => response.json())
        .then(data => {
            dropdown.innerHTML = '';
            
            if (data.error || !data.categories || data.categories.length === 0) {
                dropdown.classList.add('hidden');
                return;
            }
            
            data.categories.forEach(category => {
                const item = document.createElement('div');
                item.className = 'px-4 py-2.5 cursor-pointer border-b border-gray-100 last:border-0 text-gray-800 hover:bg-indigo-50 transition-colors';
                item.textContent = category.category_name;
                item.onclick = () => {
                    document.getElementById('matter_category').value = category.category_name;
                    dropdown.classList.add('hidden');
                };
                dropdown.appendChild(item);
            });
            
            dropdown.classList.remove('hidden');
        })
        .catch(error => {
            console.error('Error:', error);
            dropdown.classList.add('hidden');
        });
}

document.getElementById('matterEditForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const originalText = submitBtn.innerHTML;
    
    // Validate required fields
    if (!document.getElementById('assigned_employee_id').value) {
        scAlert('Please select an assigned employee');
        return;
    }
    
    const formData = {
        matter_title: document.getElementById('matter_title').value.trim().toUpperCase(),
        matter_category: document.getElementById('matter_category').value.trim().toUpperCase(),
        assigned_employee_id: parseInt(document.getElementById('assigned_employee_id').value),
        date_opened: document.getElementById('date_opened').value,
        client_instructions: document.getElementById('client_instructions').value.trim()
    };
    
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Updating...';
    
    fetch(`/api/matters/update/${document.getElementById('matter_id').value}`, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
    })
    .then(response => response.json())
    .then(data => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
        
        if (data.success) {
            scAlert('Matter updated successfully!');
            window.location.href = '{{ url_for("matter_details", matter_id=matter_id) }}';
        } else {
            scAlert(data.error || 'Error updating matter');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
        scAlert('An error occurred while updating the matter.');
    });
});

// Close dropdowns when clicking outside
document.addEventListener('click', function(event) {
    const employeeDropdown = document.getElementById('employee_dropdown');
    const employeeSearch = document.getElementById('employee_search');
    const categoryDropdown = document.getElementById('matter_category_dropdown');
    const categorySearch = document.getElementById('matter_category');
    
    if (employeeDropdown && employeeSearch && !employeeDropdown.contains(event.target) && event.target !== employeeSearch) {
        employeeDropdown.classList.add('hidden');
    }
    
    if (categoryDropdown && categorySearch && !categoryDropdown.contains(event.target) && event.target !== categorySearch) {
        categoryDropdown.classList.add('hidden');
    }
});
</script>
{% endblock %}
