<div id="section-1" class="settings-section bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden">
            <div class="settings-section-header">
                <h2 class="settings-section-title">
                    <i class="fas fa-building settings-section-icon"></i>
                    1. Basic Company Information
                </h2>
                <p class="settings-section-subtitle">Main identity details of the law firm.</p>
            </div>
            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Company / Law Firm Name</label>
                    <input type="text" name="company_name" value="{{ cs.get('company_name') or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="e.g. BAUNI LAW GROUP">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Company Logo</label>
                    <input type="file" name="company_logo" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-indigo-50 file:text-indigo-700">
                    {% if cs.get('company_logo') %}
                    <p class="mt-1 text-xs text-gray-500">Current: {{ cs.company_logo }}</p>
                    {% endif %}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Company Tagline (optional)</label>
                    <input type="text" name="company_tagline" value="{{ cs.get('company_tagline') or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Excellence in Legal Services">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Registration Number / Law Firm Number</label>
                    <input type="text" name="registration_number" value="{{ cs.get('registration_number') or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tax PIN / VAT Number</label>
                    <input type="text" name="tax_pin_vat_number" value="{{ cs.get('tax_pin_vat_number') or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Year Established</label>
                    <input type="text" name="year_established" value="{{ cs.get('year_established') or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="e.g. 2010">
                </div>
            </div>
        </div>
