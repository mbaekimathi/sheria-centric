<style>
/* Reserve room beneath any sticky header so anchor jumps don't hide titles */
    html { scroll-behavior: smooth; }
    .settings-section { scroll-margin-top: 96px; }

    /* Themed section header — stays readable on ANY selected system theme.
       Uses brand-primary as the background and the light brand-tertiary for
       the icon, with white text for the title and translucent white for the
       subtitle so contrast is preserved across every preset palette. */
    .settings-section-header {
        padding: 1rem 1.5rem;
        background: linear-gradient(
            135deg,
            var(--brand-primary) 0%,
            var(--brand-primary) 65%,
            color-mix(in srgb, var(--brand-primary) 78%, var(--brand-accent)) 100%
        );
        border-bottom: 1px solid rgba(255, 255, 255, 0.10);
        color: #ffffff;
    }
    .settings-section-header .settings-section-title {
        margin: 0;
        display: flex;
        align-items: center;
        font-size: 1.125rem;
        line-height: 1.5;
        font-weight: 700;
        color: #ffffff !important;
    }
    .settings-section-header .settings-section-icon {
        margin-right: 0.5rem;
        color: var(--brand-tertiary, #A29BFE) !important;
    }
    .settings-section-header .settings-section-subtitle {
        margin-top: 0.25rem;
        font-size: 0.875rem;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.78) !important;
    }

    /* Indented sub-link styling for the in-page TOC */
    .sidebar-link-sub {
        padding-top: 6px !important;
        padding-bottom: 6px !important;
        opacity: 0.85;
        border-left: 2px solid transparent;
        border-radius: 0 8px 8px 0;
    }
    .sidebar-link-sub:hover {
        opacity: 1;
        background: var(--brand-accent-soft, #f3f2ff) !important;
    }
    .sidebar-link-sub.is-current {
        opacity: 1;
        font-weight: 600;
        color: var(--brand-accent, #6C5CE7) !important;
        background: var(--brand-accent-soft, #f3f2ff) !important;
        border-left-color: var(--brand-accent, #6C5CE7);
    }
    .sidebar-link-sub.is-current i { color: var(--brand-accent, #6C5CE7) !important; }

    .settings-required { color: #ef4444; font-weight: 700; margin-left: 2px; }
    .settings-tip {
        position: relative;
        display: inline-flex;
        align-items: center;
        margin-left: 6px;
        color: var(--brand-accent, #6C5CE7);
        cursor: help;
        vertical-align: middle;
    }
    .settings-tip .settings-tip-text {
        display: none;
        position: absolute;
        left: 50%;
        bottom: calc(100% + 8px);
        transform: translateX(-50%);
        width: max-content;
        max-width: 260px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #1f2937;
        color: #fff;
        font-size: 0.75rem;
        font-weight: 500;
        line-height: 1.4;
        z-index: 40;
        box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }
    .settings-tip:hover .settings-tip-text,
    .settings-tip:focus .settings-tip-text,
    .settings-tip:focus-within .settings-tip-text { display: block; }
    .settings-section-pct {
        margin-left: auto;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 2px 10px;
        border-radius: 999px;
        background: rgba(255,255,255,0.16);
        color: #fff;
        white-space: nowrap;
    }
    .settings-section-header .settings-section-title-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
    }
    .settings-char-counter { font-size: 0.75rem; color: #9ca3af; margin-top: 0.25rem; }
    .settings-char-counter.is-over { color: #dc2626; font-weight: 600; }
    .firm-settings-slide {
        border: 1px solid #e5e7eb;
        border-radius: 1rem;
        background: #0B1220;
        overflow: hidden;
        max-width: 48rem;
    }
    .firm-settings-slide-stage {
        position: relative;
        min-height: 11rem;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        gap: 1rem;
    }
    .firm-settings-slide-stage--pair {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: end;
    }
    .firm-settings-slide-stage--multi {
        grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr));
        align-items: end;
        justify-items: center;
    }
    .firm-settings-slide-item {
        margin: 0;
        display: grid;
        justify-items: center;
        gap: 0.65rem;
        opacity: 1;
        transform: none;
        pointer-events: auto;
    }
    .firm-settings-slide-item img {
        max-height: 8.5rem;
        max-width: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        background: transparent;
        border: 0;
        box-shadow: none;
        border-radius: 0;
    }
    .firm-settings-slide-item figcaption {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.62);
    }
    .firm-settings-slide-note {
        margin: 0;
        padding: 0 1.25rem 1rem;
        font-size: 0.75rem;
        color: rgba(255,255,255,0.55);
        text-align: center;
    }
    .firm-settings-hero-card {
        max-width: 20rem;
    }
    .firm-settings-hero-preview {
        position: relative;
        display: block;
        width: 100%;
        max-width: none;
        aspect-ratio: 1 / 1;
        margin: 0;
        min-height: 0;
        padding: 0.75rem;
        border-radius: 0;
        background: #0B1220;
        border: 0;
        border-bottom: 1px solid #e5e7eb;
        overflow: hidden;
    }
    .firm-settings-hero-preview img {
        position: absolute;
        inset: 0.75rem;
        width: calc(100% - 1.5rem);
        height: calc(100% - 1.5rem);
        max-width: none;
        max-height: none;
        object-fit: contain;
        object-position: center;
        background: transparent;
        border: 0;
        box-shadow: none;
        border-radius: 0;
    }
    .firm-settings-hero-preview-empty {
        color: rgba(255, 255, 255, 0.55);
        font-size: 0.8125rem;
        text-align: center;
    }
</style>
<script>
(function () {
    function bindCharCounter(el) {
        if (!el || el.dataset.counterBound) return;
        var max = parseInt(el.getAttribute('maxlength') || el.getAttribute('data-counter-max') || '0', 10);
        if (!max) return;
        el.dataset.counterBound = '1';
        var counter = el.parentElement && el.parentElement.querySelector('[data-char-counter-for="' + (el.name || '') + '"]');
        if (!counter && el.parentElement) {
            counter = document.createElement('p');
            counter.className = 'settings-char-counter';
            counter.setAttribute('data-char-counter-for', el.name || '');
            counter.innerHTML = '<span>0</span> / ' + max;
            el.parentElement.appendChild(counter);
        }
        var span = counter ? counter.querySelector('span') : null;
        function upd() {
            var len = (el.value || '').length;
            if (len > max) el.value = el.value.slice(0, max);
            if (span) span.textContent = String((el.value || '').length);
            if (counter) counter.classList.toggle('is-over', (el.value || '').length >= max);
        }
        el.addEventListener('input', upd);
        upd();
    }
    function scan(root) {
        (root || document).querySelectorAll('input[maxlength], textarea[maxlength], .seo-counter-input').forEach(bindCharCounter);
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { scan(document); });
    } else {
        scan(document);
    }
    document.addEventListener('htmx:afterSwap', function (e) {
        scan(e.target);
    });
    var form = document.getElementById('systemSettingsForm') || document.getElementById('websiteTemplateForm');
    if (form) {
        form.addEventListener('click', function (e) {
            var btn = e.target.closest('button[id$="-btn"], button[class*="add-"]');
            if (!btn) return;
            setTimeout(function () { scan(form); }, 50);
        });
    }
})();
</script>
