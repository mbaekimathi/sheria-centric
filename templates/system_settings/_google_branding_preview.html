<div class="google-branding-preview flex flex-col gap-2 sm:flex-row sm:flex-wrap sm:items-center">
    <span class="text-xs font-medium text-gray-600">View full size in Google:</span>
    <div class="flex flex-wrap gap-1.5">
        <button type="button"
            class="google-branding-preview-btn inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-semibold bg-blue-600 text-white hover:bg-blue-700 transition-colors"
            data-google-preview-type="doc"
            title="Open a new Google Doc with firm letterhead, stamp, and signature">
            <i class="fas fa-file-word"></i> Google Doc
        </button>
        <button type="button"
            class="google-branding-preview-btn inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-semibold bg-amber-500 text-white hover:bg-amber-600 transition-colors"
            data-google-preview-type="slides"
            title="Open a new Google Slides deck with firm branding on the first slide">
            <i class="fas fa-file-powerpoint"></i> Google Slides
        </button>
        <button type="button"
            class="google-branding-preview-btn inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-semibold bg-purple-600 text-white hover:bg-purple-700 transition-colors"
            data-google-preview-type="notebook"
            title="Open a new Google Notes document with firm branding">
            <i class="fas fa-book"></i> Google Notes
        </button>
    </div>
</div>
