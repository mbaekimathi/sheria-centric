<div id="section-2" class="settings-section bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden">
            <div class="settings-section-header">
                <h2 class="settings-section-title">
                    <i class="fas fa-address-book settings-section-icon"></i>
                    2. Contact Information
                </h2>
                <p class="settings-section-subtitle">Used for communication with clients.</p>
            </div>
            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Official Email Address</label>
                    <input type="email" name="email" value="{{ cs.get('email') or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                    <input type="text" name="contact_number" value="{{ cs.get('contact_number') or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">WhatsApp Number</label>
                    <input type="text" name="whatsapp_number" value="{{ cs.get('whatsapp_number') or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Alternative Phone Number</label>
                    <input type="text" name="alternative_phone" value="{{ cs.get('alternative_phone') or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Customer Support Email</label>
                    <input type="email" name="customer_support_email" value="{{ cs.get('customer_support_email') or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
        </div>
